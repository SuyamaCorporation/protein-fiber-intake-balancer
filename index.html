<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タンパク質×食物繊維バランスチェッカー</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*:focus-visible { outline: 2px solid #22c55e; outline-offset: 2px; }
.bar-fill { transition: width 0.6s cubic-bezier(.4,0,.2,1); }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold mb-1 text-green-400">タンパク質×食物繊維バランスチェッカー</h1>
  <p class="text-gray-400 text-sm mb-6">1日の食事を記録してバランスを最適化しましょう</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="bg-gray-900 rounded-xl p-4">
      <label class="block text-xs text-gray-400 mb-1">体重 (kg)</label>
      <input id="weight" type="number" value="60" min="30" max="200"
        class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-lg font-bold text-center focus:outline-none focus:border-green-500"
        onchange="updateTargets()" aria-label="体重入力">
    </div>
    <div class="bg-gray-900 rounded-xl p-4">
      <div class="text-xs text-gray-400 mb-1">タンパク質目標</div>
      <div class="text-xl font-bold text-blue-400"><span id="protTarget">90</span>g <span class="text-sm text-gray-500">/ 日</span></div>
      <div class="text-xs text-gray-500 mt-1">体重 × 1.5g</div>
    </div>
    <div class="bg-gray-900 rounded-xl p-4">
      <div class="text-xs text-gray-400 mb-1">食物繊維目標</div>
      <div class="text-xl font-bold text-orange-400">25g <span class="text-sm text-gray-500">/ 日</span></div>
      <div class="text-xs text-gray-500 mt-1">成人推奨量</div>
    </div>
  </div>

  <div class="bg-gray-900 rounded-xl p-4 mb-4">
    <h2 class="text-sm font-semibold text-gray-300 mb-3">食品追加</h2>
    <div class="flex flex-col md:flex-row gap-2">
      <div class="flex-1 relative">
        <input id="foodSearch" type="text" placeholder="食品名を入力（例: 鶏胸肉）"
          class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500"
          oninput="searchFood()" aria-label="食品名検索" autocomplete="off">
        <div id="foodSuggestions" class="absolute z-10 w-full bg-gray-800 border border-gray-700 rounded-b-lg hidden max-h-48 overflow-y-auto"></div>
      </div>
      <input id="foodAmount" type="number" value="100" min="1" max="2000" placeholder="量(g)"
        class="w-28 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500" aria-label="食品量(g)">
      <button onclick="addFood()" class="bg-green-700 hover:bg-green-600 px-4 py-2 rounded text-sm font-medium transition-colors">追加</button>
    </div>
    <div id="selectedFood" class="mt-2 text-xs text-gray-400"></div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
    <div class="bg-gray-900 rounded-xl p-4">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm font-medium text-blue-400">タンパク質</span>
        <span class="text-sm font-bold"><span id="protCurrent">0</span>g / <span id="protTargetDisp">90</span>g</span>
      </div>
      <div class="h-4 bg-gray-800 rounded-full overflow-hidden">
        <div id="protBar" class="bar-fill h-full bg-blue-500 rounded-full" style="width:0%"></div>
      </div>
      <div class="text-xs text-gray-400 mt-1">あと <span id="protRemain" class="text-blue-300 font-semibold">90</span>g</div>
    </div>
    <div class="bg-gray-900 rounded-xl p-4">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm font-medium text-orange-400">食物繊維</span>
        <span class="text-sm font-bold"><span id="fiberCurrent">0</span>g / 25g</span>
      </div>
      <div class="h-4 bg-gray-800 rounded-full overflow-hidden">
        <div id="fiberBar" class="bar-fill h-full bg-orange-500 rounded-full" style="width:0%"></div>
      </div>
      <div class="text-xs text-gray-400 mt-1">あと <span id="fiberRemain" class="text-orange-300 font-semibold">25</span>g</div>
    </div>
  </div>

  <div class="bg-gray-900 rounded-xl p-4 mb-4">
    <div class="flex justify-between items-center mb-2">
      <h2 class="text-sm font-semibold text-gray-300">腸活スコア</h2>
      <div class="text-2xl font-bold text-teal-400"><span id="gutScore">0</span><span class="text-sm text-gray-500">/100</span></div>
    </div>
    <div class="h-3 bg-gray-800 rounded-full overflow-hidden">
      <div id="gutBar" class="bar-fill h-full bg-gradient-to-r from-teal-600 to-teal-400 rounded-full" style="width:0%"></div>
    </div>
    <div id="gutTips" class="text-xs text-gray-400 mt-2"></div>
  </div>

  <div class="bg-gray-900 rounded-xl p-4 mb-4">
    <h2 class="text-sm font-semibold text-gray-300 mb-2">補充食材おすすめ TOP3</h2>
    <div id="suggestions" class="space-y-2"></div>
  </div>

  <div class="bg-gray-900 rounded-xl p-4 mb-4">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-sm font-semibold text-gray-300">本日の食事記録</h2>
      <button onclick="clearToday()" class="text-xs text-red-400 hover:text-red-300 transition-colors">本日クリア</button>
    </div>
    <div id="foodList" class="space-y-2"></div>
  </div>

  <div class="bg-gray-900 rounded-xl p-4">
    <h2 class="text-sm font-semibold text-gray-300 mb-3">過去7日間の推移</h2>
    <div id="weekChart" class="space-y-1"></div>
  </div>
</div>

<script>
function htmlEscape(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const FOODS = [
  {name:'鶏胸肉',prot:22.3,fiber:0},{name:'鶏もも肉',prot:16.6,fiber:0},{name:'豚ロース',prot:19.3,fiber:0},
  {name:'牛もも肉',prot:21.2,fiber:0},{name:'サーモン',prot:20.1,fiber:0},{name:'マグロ（赤身）',prot:26.4,fiber:0},
  {name:'卵',prot:12.3,fiber:0},{name:'木綿豆腐',prot:6.6,fiber:0.3},{name:'絹豆腐',prot:4.9,fiber:0.2},
  {name:'納豆',prot:16.5,fiber:6.7},{name:'牛乳',prot:3.3,fiber:0},{name:'ギリシャヨーグルト',prot:10.0,fiber:0},
  {name:'プロテインパウダー',prot:75,fiber:0},{name:'枝豆',prot:11.5,fiber:4.6},{name:'ひよこ豆',prot:9.5,fiber:11.6},
  {name:'レンズ豆',prot:9.0,fiber:9.0},{name:'黒豆',prot:14.2,fiber:7.0},{name:'白米（炊飯）',prot:2.5,fiber:0.3},
  {name:'玄米（炊飯）',prot:2.8,fiber:1.4},{name:'オートミール',prot:13.7,fiber:9.4},
  {name:'全粒粉パン',prot:9.5,fiber:4.5},{name:'食パン',prot:8.9,fiber:2.3},{name:'そば（茹）',prot:4.8,fiber:1.5},
  {name:'うどん（茹）',prot:2.6,fiber:0.4},{name:'パスタ（茹）',prot:5.8,fiber:1.5},
  {name:'ブロッコリー',prot:4.3,fiber:4.4},{name:'ほうれん草',prot:2.2,fiber:2.8},
  {name:'キャベツ',prot:1.3,fiber:1.8},{name:'ごぼう',prot:1.8,fiber:5.7},{name:'さつまいも',prot:1.2,fiber:2.2},
  {name:'じゃがいも',prot:1.6,fiber:1.3},{name:'アボカド',prot:2.1,fiber:5.3},{name:'バナナ',prot:1.1,fiber:1.1},
  {name:'りんご',prot:0.2,fiber:1.4},{name:'みかん',prot:0.7,fiber:1.0},{name:'いちご',prot:0.9,fiber:1.4},
  {name:'アーモンド',prot:19.6,fiber:10.1},{name:'くるみ',prot:14.6,fiber:7.5},{name:'ピーナッツ',prot:25.4,fiber:7.4},
  {name:'ごま',prot:19.8,fiber:12.2},{name:'チアシード',prot:16.5,fiber:34.4},{name:'ひじき',prot:9.2,fiber:51.8},
  {name:'わかめ',prot:12.7,fiber:35.6},{name:'キムチ',prot:2.1,fiber:2.5},{name:'味噌',prot:12.5,fiber:4.9},
  {name:'ギリシャヨーグルト（無糖）',prot:10.0,fiber:0},{name:'カッテージチーズ',prot:13.3,fiber:0},
  {name:'まぐろ缶（水煮）',prot:16.0,fiber:0},{name:'サバ缶',prot:17.2,fiber:0},
  {name:'鮭フレーク',prot:19.4,fiber:0},{name:'ちりめんじゃこ',prot:46.5,fiber:0},
  {name:'高野豆腐',prot:49.4,fiber:0.4},{name:'きな粉',prot:35.5,fiber:15.4},
  {name:'おから',prot:6.1,fiber:11.5},{name:'えだまめ',prot:11.5,fiber:4.6},
  {name:'かぼちゃ',prot:1.9,fiber:3.5},{name:'とうもろこし',prot:3.6,fiber:3.0},
  {name:'キヌア',prot:14.1,fiber:7.0},{name:'テンペ',prot:18.5,fiber:4.1},
  {name:'えび',prot:21.7,fiber:0},{name:'いか',prot:17.9,fiber:0},
  {name:'ツナサラダ',prot:14.0,fiber:0.5},{name:'鶏ハム',prot:20.0,fiber:0},
];

let selectedFoodData = null;
let todayMeals = [];
const TODAY_KEY = 'pf_' + new Date().toISOString().slice(0,10);

function loadData() {
  const raw = localStorage.getItem(TODAY_KEY);
  todayMeals = raw ? JSON.parse(raw) : [];
  const w = localStorage.getItem('pf_weight');
  if (w) document.getElementById('weight').value = w;
}

function saveData() {
  localStorage.setItem(TODAY_KEY, JSON.stringify(todayMeals));
  localStorage.setItem('pf_weight', document.getElementById('weight').value);
}

function updateTargets() {
  const w = parseFloat(document.getElementById('weight').value) || 60;
  const target = Math.round(w * 1.5);
  document.getElementById('protTarget').textContent = target;
  document.getElementById('protTargetDisp').textContent = target;
  saveData();
  render();
}

function getProtTarget() {
  return Math.round((parseFloat(document.getElementById('weight').value) || 60) * 1.5);
}

function searchFood() {
  const q = document.getElementById('foodSearch').value.trim().toLowerCase();
  const box = document.getElementById('foodSuggestions');
  if (!q) { box.classList.add('hidden'); selectedFoodData = null; return; }
  const matches = FOODS.filter(f => f.name.toLowerCase().includes(q)).slice(0, 8);
  if (!matches.length) { box.classList.add('hidden'); return; }
  box.innerHTML = matches.map(f =>
    `<div class="px-3 py-2 hover:bg-gray-700 cursor-pointer text-sm" onclick="selectFood(${FOODS.indexOf(f)})">${htmlEscape(f.name)} <span class="text-gray-400 text-xs">P:${f.prot}g F:${f.fiber}g /100g</span></div>`
  ).join('');
  box.classList.remove('hidden');
}

function selectFood(idx) {
  selectedFoodData = FOODS[idx];
  document.getElementById('foodSearch').value = selectedFoodData.name;
  document.getElementById('foodSuggestions').classList.add('hidden');
  document.getElementById('selectedFood').textContent = `選択中: ${selectedFoodData.name} (P:${selectedFoodData.prot}g / F:${selectedFoodData.fiber}g per 100g)`;
}

function addFood() {
  if (!selectedFoodData) {
    const q = document.getElementById('foodSearch').value.trim();
    if (!q) return;
    selectedFoodData = { name: q, prot: 0, fiber: 0 };
  }
  const amount = parseFloat(document.getElementById('foodAmount').value) || 100;
  const prot = Math.round(selectedFoodData.prot * amount / 100 * 10) / 10;
  const fiber = Math.round(selectedFoodData.fiber * amount / 100 * 10) / 10;
  todayMeals.push({ name: selectedFoodData.name, amount, prot, fiber, isFermented: ['納豆','味噌','キムチ','ヨーグルト','テンペ'].some(f => selectedFoodData.name.includes(f)) });
  document.getElementById('foodSearch').value = '';
  document.getElementById('selectedFood').textContent = '';
  document.getElementById('foodSuggestions').classList.add('hidden');
  selectedFoodData = null;
  saveData();
  render();
}

function removeFood(idx) {
  todayMeals.splice(idx, 1);
  saveData();
  render();
}

function clearToday() {
  if (confirm('本日の記録をすべて削除しますか？')) {
    todayMeals = [];
    saveData();
    render();
  }
}

function render() {
  const totProt = Math.round(todayMeals.reduce((s,m) => s+m.prot, 0) * 10) / 10;
  const totFiber = Math.round(todayMeals.reduce((s,m) => s+m.fiber, 0) * 10) / 10;
  const protTarget = getProtTarget();
  const fiberTarget = 25;

  document.getElementById('protCurrent').textContent = totProt;
  document.getElementById('fiberCurrent').textContent = totFiber;
  document.getElementById('protRemain').textContent = Math.max(0, protTarget - totProt).toFixed(1);
  document.getElementById('fiberRemain').textContent = Math.max(0, fiberTarget - totFiber).toFixed(1);

  const protPct = Math.min(100, totProt / protTarget * 100);
  const fiberPct = Math.min(100, totFiber / fiberTarget * 100);
  document.getElementById('protBar').style.width = protPct + '%';
  document.getElementById('fiberBar').style.width = fiberPct + '%';

  const fermented = todayMeals.filter(m => m.isFermented).length;
  const soluble = todayMeals.filter(m => ['アボカド','オートミール','りんご','バナナ','大麦'].some(n => m.name.includes(n))).length;
  const gutScore = Math.min(100, Math.round(fiberPct * 0.5 + fermented * 15 + soluble * 10));
  document.getElementById('gutScore').textContent = gutScore;
  document.getElementById('gutBar').style.width = gutScore + '%';
  document.getElementById('gutTips').textContent = gutScore >= 70 ? '腸活スコア良好！発酵食品・食物繊維バランスが取れています。' : '発酵食品（納豆・ヨーグルト・味噌）を追加するとスコアが上がります。';

  renderSuggestions(protTarget - totProt, fiberTarget - totFiber);
  renderFoodList();
  renderWeekChart();
}

function renderSuggestions(needProt, needFiber) {
  const box = document.getElementById('suggestions');
  if (needProt <= 0 && needFiber <= 0) {
    box.innerHTML = '<p class="text-green-400 text-sm">本日の目標達成！素晴らしいです！</p>';
    return;
  }
  const scored = FOODS.map(f => {
    const ps = needProt > 0 ? f.prot / 100 * Math.min(needProt, 100) : 0;
    const fs = needFiber > 0 ? f.fiber / 100 * Math.min(needFiber, 25) * 2 : 0;
    return { ...f, score: ps + fs };
  }).sort((a,b) => b.score - a.score).slice(0, 3);

  box.innerHTML = scored.map(f => `
    <div class="flex items-center gap-3 bg-gray-800 rounded-lg p-3">
      <div class="text-green-400 font-bold text-lg">+</div>
      <div class="flex-1">
        <div class="text-sm font-medium">${htmlEscape(f.name)}</div>
        <div class="text-xs text-gray-400">100gで P:${f.prot}g / F:${f.fiber}g</div>
      </div>
      <button onclick="quickAdd('${htmlEscape(f.name)}')" class="text-xs bg-green-900 hover:bg-green-800 px-2 py-1 rounded transition-colors">追加</button>
    </div>`).join('');
}

function quickAdd(name) {
  const food = FOODS.find(f => f.name === name);
  if (!food) return;
  selectedFoodData = food;
  document.getElementById('foodSearch').value = name;
  document.getElementById('foodAmount').value = 100;
  addFood();
}

function renderFoodList() {
  const box = document.getElementById('foodList');
  if (!todayMeals.length) {
    box.innerHTML = '<p class="text-gray-500 text-sm">食品を追加してください</p>';
    return;
  }
  box.innerHTML = todayMeals.map((m,i) => `
    <div class="flex items-center gap-2 bg-gray-800 rounded-lg px-3 py-2">
      <div class="flex-1 text-sm">${htmlEscape(m.name)}</div>
      <div class="text-xs text-gray-400">${m.amount}g</div>
      <div class="text-xs text-blue-400 w-16 text-right">P: ${m.prot}g</div>
      <div class="text-xs text-orange-400 w-16 text-right">F: ${m.fiber}g</div>
      <button onclick="removeFood(${i})" class="text-red-400 hover:text-red-300 text-xs ml-2" aria-label="削除">✕</button>
    </div>`).join('');
}

function renderWeekChart() {
  const box = document.getElementById('weekChart');
  const rows = [];
  for (let d = 6; d >= 0; d--) {
    const dt = new Date(); dt.setDate(dt.getDate() - d);
    const key = 'pf_' + dt.toISOString().slice(0,10);
    const meals = key === TODAY_KEY ? todayMeals : (JSON.parse(localStorage.getItem(key) || '[]'));
    const prot = Math.round(meals.reduce((s,m) => s+m.prot, 0));
    const fiber = Math.round(meals.reduce((s,m) => s+m.fiber, 0));
    const label = d === 0 ? '今日' : `${dt.getMonth()+1}/${dt.getDate()}`;
    const protPct = Math.min(100, prot / getProtTarget() * 100);
    const fiberPct = Math.min(100, fiber / 25 * 100);
    rows.push(`<div class="flex items-center gap-2 text-xs">
      <div class="w-10 text-gray-400 text-right">${label}</div>
      <div class="flex-1 flex gap-1">
        <div class="h-3 bg-blue-500 rounded" style="width:${protPct}%; min-width:2px" title="P:${prot}g"></div>
      </div>
      <div class="flex-1 flex gap-1">
        <div class="h-3 bg-orange-500 rounded" style="width:${fiberPct}%; min-width:2px" title="F:${fiber}g"></div>
      </div>
      <div class="w-20 text-gray-500">P:${prot}g F:${fiber}g</div>
    </div>`);
  }
  box.innerHTML = `<div class="flex text-xs text-gray-500 mb-1"><div class="w-10"></div><div class="flex-1 text-center">タンパク質</div><div class="flex-1 text-center">食物繊維</div><div class="w-20"></div></div>` + rows.join('');
}

document.addEventListener('click', e => {
  if (!e.target.closest('#foodSearch') && !e.target.closest('#foodSuggestions')) {
    document.getElementById('foodSuggestions').classList.add('hidden');
  }
});

loadData();
render();
</script>
</body>
</html>
